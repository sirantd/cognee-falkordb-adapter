[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognee-falkordb-adapter"
version = "0.3.1"
description = "A provenance-complete FalkorDB graph adapter for cognee"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "falkordb>=1.6.2,<2",
  # 🚨 PIN, DO NOT RELAX. falkordb-py's async FalkorDB.__init__ calls
  # Is_Cluster(), which copies the ASYNC pool's connection_kwargs into a SYNC
  # redis.Redis(**kwargs). At redis 8.1.0 those kwargs carry `himport_registry`,
  # which sync Redis rejects:
  #     TypeError: Redis.__init__() got an unexpected keyword argument 'himport_registry'
  # It fires in the constructor, before any connection, so the adapter cannot be
  # built at all — every cognify, recall and delete fails identically.
  #
  # ⚠ Measured 2026-08-09 against falkordb 1.6.2, and it CONTRADICTS the note in
  # the #68 spike findings calling this pin "graphiti-specific". It is not: it is
  # a property of falkordb-py's async client, which is the client this adapter
  # uses. Verified both directions — 8.1.0 raises, 8.0.0 constructs cleanly, and
  # `from_url` is affected exactly like the keyword constructor. The SYNC client
  # is unaffected, which is the likely reason the spike's probe missed it.
  "redis>=8.0.0,<8.1.0",
]

[project.optional-dependencies]
# cognee is a peer, not a runtime dependency: the adapter is installed INTO a
# cognee image that already provides it. Pinned exactly for tests because the
# graph interface has moved twice in four months and the contract suite is our
# only drift detector.
#
# 📌 1.5.2 -> 1.5.4 is the first bump in this series that is NOT interface-inert,
# and the census is what caught it. GraphDBInterface's 21 abstractmethods and
# their signatures are still byte-identical, but two other things moved:
#
#   1. The contract suite grew 19 -> 20. The new case,
#      test_concurrent_folded_writes_and_attaches_keep_every_owner, is real new
#      required behaviour: it catches a fold racing attach into lost owner keys.
#      This adapter FAILED it (7-10 of 24 keys lost per run) until #7 fixed the
#      race. The bump was blocked on that fix, not the other way round.
#   2. GraphDBInterface gained two opt-in capability flags
#      (supports_per_row_source_refs, supports_incremental_chunk_updates, both
#      defaulting False) and a non-abstract update_chunk_index that RAISES
#      UnsupportedGraphOperation unless overridden. Inheriting all three is safe
#      and deliberate here - unlike remove_belongs_to_set_tags, whose interface
#      default is a silent no-op, these fail loudly or stay switched off. Adopting
#      either capability is a feature decision, not a gate.
#
# ✅ MEASURED, not asserted: ci's `contract` job gates this pin - cognee 1.5.4
# installed, a live FalkorDB service, 20 passed with FALKORDB_REQUIRED=1 so skips
# cannot read green. 1.5.3 is skipped deliberately: it still carries 19 cases, so
# it would re-gate green without proving anything the 1.5.2 pin did not.
test = [
  "cognee==1.5.4",
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cognee_falkordb_adapter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs a live FalkorDB (FALKORDB_HOST / FALKORDB_PORT)",
]
