name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  surface:
    # The cheap gate: abstract coverage, signature drift against the pinned
    # cognee, the pure port helpers, and the contract-suite census and pin.
    # Needs no server, so it must never be gated behind one — hence "not
    # integration" rather than a file list, which would silently stop covering
    # the next server-free test module added.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: pytest -s -m "not integration"

  contract:
    # The real gate (stage A5): cognee's own backend-neutral graph-provenance
    # contract suite — all 20 cases, unmodified — run against a live FalkorDB.
    runs-on: ubuntu-latest
    services:
      falkordb:
        # 🚨 Track the deployed store's pin (homelab
        # roles/truenas-falkordb/defaults/main.yml: falkordb_image). A gate that
        # blesses the adapter against a FalkorDB nobody runs is a weaker claim
        # than it reads as — the point of this job is "works against
        # PRODUCTION's store", not "works against some FalkorDB".
        image: falkordb/falkordb:v4.20.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GRAPH_DATABASE_PROVIDER: falkordb
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: "6379"
      # 🚨 A skipped gate is a green gate. The contract fixture skips when no
      # server answers, which is right on a laptop and a false pass here — 20
      # skips read as 20 passes in the job summary. This makes it fail instead.
      FALKORDB_REQUIRED: "1"
      # Guards the graph-only registration: the adapter refuses to load if
      # anything has pointed the vector store at FalkorDB.
      VECTOR_DB_PROVIDER: pgvector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - name: the himport_registry trap stays shut
        # Regression guard. falkordb-py < 1.7.0 forwards the ASYNC pool's
        # connection_kwargs into a SYNC redis.Redis(); at redis >= 8.1.0 those
        # carry `himport_registry`, which sync Redis rejects — in the constructor,
        # before any I/O, so every cognify, recall and delete fails identically.
        #
        # 📌 Asserts the BEHAVIOUR, not a version range. The previous guard
        # asserted `redis < 8.1`, which stopped being the constraint the moment
        # falkordb-py 1.7.0 fixed it at the source: that assert would now fail a
        # combination this repo has measured as working. Constructing the real
        # client cannot go stale that way — it re-derives the answer every run,
        # whatever the resolver picked.
        run: |
          python -c "
          import importlib.metadata as md
          from falkordb.asyncio import FalkorDB
          print('falkordb', md.version('falkordb'), '| redis', md.version('redis'))
          for label, build in (
              ('keyword ctor', lambda: FalkorDB(host='127.0.0.1', port=6379)),
              ('from_url', lambda: FalkorDB.from_url('redis://127.0.0.1:6379')),
          ):
              try:
                  build()
              except TypeError as exc:
                  raise SystemExit(f'himport_registry trap is live via {label}: {exc}')
              print(label, 'ok')
          "
      - name: cognee provenance contract suite — the A5 gate
        # Its own step so a red build says which half broke: cognee's contract,
        # or our port delta. Expect "20 passed"; the census in the surface job
        # is what keeps that number honest.
        run: pytest tests/test_contract.py -v
      - name: adapter integration tests
        run: pytest -m integration -v --ignore=tests/test_contract.py
